name: Deploy to PyPi

on:
  release:
    types: [published]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: install dependencies
        run: make dev

      - name: clean up
        run: make clean

      - name: Build Python
        run: make package

      - name: Upload Package
        if: ${{ !env.ACT && env.PYPI_TOKEN != '' }} # Upload only when publishing is configured
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: make deploy
